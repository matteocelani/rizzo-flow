<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jevbet mock Texas Hold'em table</title>
</head>
<body>
  <div id="table"
       data-game="holdem"
       data-street="flop"
       data-bankroll="1000"
       data-pot="60"
       data-to-call="20"
       data-stack="940"
       data-position="CO"
       data-players="6"
       data-min-raise="20"
       data-raise-suggestions="20,30,50">
    <div data-role="hero" data-cards="AH,KD"></div>
    <div data-role="board" data-cards="QS,JH,2C"></div>
    <button type="button" data-action="fold">Fold</button>
    <button type="button" data-action="call">Call</button>
    <button type="button" data-action="raise">Raise</button>
  </div>
</body>
</html>
